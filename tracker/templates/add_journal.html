{% extends 'base.html' %}

{% block content %}

<div class="journal-form-page">

    <h1>New Journal Entry</h1>
    <p>Write about your thoughts, progress or experiences.</p>

    <form method="POST" class="journal-form">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="journal-form-actions">
            <button type="submit" class="save-journal-btn">
                Save Entry
            </button>

            <a href="{% url 'journal' %}" class="cancel-journal-btn">
                Cancel
            </a>
        </div>
    </form>

</div>

{% endblock %}
